name: ResumeAI Pro CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Unit Tests & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System & Tesseract Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Python Bytecode Compilation Check
        run: |
          python -m py_compile backend/main.py backend/ai_provider.py

      - name: Run Backend Unit & Security Test Suite
        run: |
          python backend/test_pipeline.py
          python backend/test_telemetry_and_bugs.py
          python backend/test_milestone2.py

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: resumeai-backend:latest
